<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدرجات</title>
<style>
:root{box-sizing:border-box;--bg:#f3f3f0;--ink:#1d1d1d;--line:#555;--btn:#fff;--acc:#1f5c55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a19;--btn:#242b29}}
:root[data-theme="dark"]{--bg:#161a19;--btn:#242b29}
:root{--card:#fff;--ink2:#1d1d1d;--mut:#6b6b6b;--blue:#1f4e8c;--ln:#d9d9d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#242b29;--ink2:#e8e8e8;--mut:#9aa8a5;--blue:#8dbbf5;--ln:#3a4543}}
:root[data-theme="dark"]{--card:#242b29;--ink2:#e8e8e8;--mut:#9aa8a5;--blue:#8dbbf5;--ln:#3a4543}
html{scroll-padding-top:180px}
body{margin:0;background:var(--bg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:12px;padding-top:calc(70px + env(safe-area-inset-top,0px));color:#e8e8e8}
@media (prefers-color-scheme:light){body{color:#1d1d1d}}
:root[data-theme="light"] body{color:#1d1d1d}
:root[data-theme="dark"] body{color:#e8e8e8}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid #888;background:var(--btn);color:inherit;border-radius:8px;padding:8px 14px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:#d2463d;border-color:#d2463d}
.pn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid #888;border-radius:10px;padding:10px;margin-bottom:10px}
.pn[hidden]{display:none}
.wrap{overflow-x:auto;border:1px solid var(--line);background:#fff;color:var(--ink)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{border:1px solid var(--line);padding:0;text-align:center;color:var(--ink)}
input{font:inherit;color:#1d1d1d;background:transparent;border:0;padding:6px 2px;text-align:center;width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--acc);background:#fff}
input.ro{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
th input{font-weight:700}
.hd{background:#e4e4e4;padding:6px 8px;font-weight:700;line-height:1.9}
.hd input{display:inline-block;width:56px;border-bottom:1px dashed #888;font-weight:700}
.mx{display:flex;justify-content:center;align-items:center;color:#c0182b;font-weight:700;padding-bottom:2px}
.mx input{width:44px;color:#c0182b;padding:2px}
.nmc{display:flex;align-items:center;min-width:200px}
.nmc input{text-align:right;padding-inline:8px;flex:1}
.x,.rb{border:0;background:transparent;padding:4px 8px;flex:none}
.x{color:#b4372f}.rb{color:#555}
.nc{width:48px;background:#ececec}
.tc{display:flex;align-items:center}
.ok{border:0;background:transparent;color:var(--acc);font-weight:700;width:100%;padding:8px 4px;color:#1f5c55}
.cr{display:none}.pick .cr{display:table-row}
.cr td{background:#fff;padding:4px}
.cr input[type=color]{width:44px;height:28px;padding:0;border:1px solid #888;cursor:pointer}
[hidden]{display:none!important}
input{touch-action:manipulation}
.btns{position:relative}
.dots{padding:8px 10px}
.mn{position:absolute;left:0;top:46px;z-index:20;background:var(--card);color:var(--ink2);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:6px;min-width:200px}
.mn button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px;font-size:17px;color:inherit}
.top2{display:flex;align-items:center;justify-content:center;position:relative;min-height:44px;margin-bottom:6px}
.top2 .bk{position:absolute;right:0;border:0;background:transparent;padding:8px;color:inherit}
.top2 h2{margin:0;font-size:20px;font-weight:600;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--ln);margin-bottom:10px}
.tab{padding:10px 8px;font-weight:700;color:var(--blue);border-bottom:3px solid var(--blue);margin-bottom:-1px}
.tabs .an{margin-inline-start:auto;border:0;background:transparent;color:var(--blue);font-weight:600}
.emp{text-align:center;color:var(--mut);padding:90px 0}
.nc2{background:var(--card);color:var(--ink2);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.14);cursor:pointer}
.nc2 small{display:block;color:var(--mut);margin-top:6px}
.ht{color:var(--mut);font-size:14px;margin:8px 0 6px}
#ll{display:block;max-width:560px;margin:0 auto}
.ht2{font-weight:700;color:var(--blue);margin:14px 0 2px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.mc{background:var(--card);color:var(--ink2);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.mc h3{margin:0 0 10px}
.mc textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;border:1px solid var(--ln);border-radius:10px;padding:10px;background:transparent;color:inherit}
.mb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sec{margin-bottom:24px;scroll-margin-top:180px}
.sb{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.sb button{padding:6px 12px}
.col{display:flex;flex-direction:column;gap:8px}
.er{background:#b4372f;color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:8px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;transform:translateX(-50%);z-index:60;background:#1f5c55;color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.sc{display:flex;gap:14px;overflow-x:auto;padding:8px 0;flex:1;min-width:0;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.sc button{flex:none;font-size:16px;font-weight:700;padding:7px 20px;border-radius:999px;background:#1f4e8c;border-color:#1f4e8c;color:#fff;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sc button.addsec{background:#b8860b!important;border-color:#b8860b!important;color:#fff!important;font-weight:700;border-radius:999px;padding:12px 24px;flex:none;font-size:20px;box-shadow:0 3px 10px rgba(184,134,11,.45)}

/* 🔧 الشريط العلوي ثابت مع دعم الزوم */
.scw{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:100vw;box-sizing:border-box}
.scw .ib{width:42px;height:42px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.scw .dots{margin-inline-start:0;padding:8px 10px}
.scw .mn,.scw .sv2{position:absolute;top:calc(100% + 6px)}
.scw .mn{left:auto;right:12px}
.scw .sv2{left:12px;display:flex;gap:6px;z-index:15}
.scw .sv2 button{box-shadow:0 2px 8px rgba(0,0,0,.3)}
.theme{margin-inline-start:auto}
button:disabled{opacity:.35}
.qb{margin-bottom:6px}.qb input{border:1px solid #888;border-radius:10px;background:#fff;padding:10px;text-align:right;font-size:16px;max-width:340px;width:100%}
.ib{width:42px;height:42px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}

table{border-collapse:separate;border-spacing:0}
th,td{border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
th:last-child,td:last-child{border-left:0}
.wrap .st{width:22px;height:22px}
.wrap .st svg{width:13px;height:13px}
.sts{gap:3px;display:flex;justify-content:center}
.stbtn{display:block;margin:3px auto;padding:2px 8px;font-size:12px;border-radius:6px;background:#fff;color:#1d1d1d;border-color:#888}
.pk{display:block;width:100%;text-align:right;margin-bottom:6px;padding:10px;font-size:16px}
.wbtn{background:#2b579a;border-color:#2b579a;color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;border-radius:10px}
.wlogo{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;background:#fff;color:#2b579a;font:900 16px Georgia,serif}
#wt{min-height:150px}
.lc{scroll-margin-top:180px}
.lc .ht2{margin-top:0;padding-bottom:6px;border-bottom:2px solid var(--blue)}
.lr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 2px;border-bottom:1px solid var(--ln)}
.ln{font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.st{width:34px;height:34px;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;opacity:.4}
.st.on{opacity:1;outline:3px solid var(--ink2);outline-offset:2px}
.st-p{background:#34c759}.st-a{background:#ff3b30}.st-l{background:#ff9500}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;flex:none;margin-inline:4px;vertical-align:middle}
.bdg svg{width:14px;height:14px}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;transform:translateX(-50%);z-index:70;background:#1f4e8c;color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#d3d6d4;border-top:1px solid #888;direction:ltr}
#kp[hidden]{display:none}
#kp button{flex:1;font-size:22px;padding:12px 0;border-radius:8px;background:#fff;color:#111;border:1px solid #999;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#kp button.kx{background:#e9ecea;font-size:17px;flex:1.3}

.fontBox{margin:8px 0;padding:12px;border:1px dashed var(--ln);border-radius:10px;background:rgba(0,0,0,.02)}
:root[data-theme="dark"] .fontBox{background:rgba(255,255,255,.03)}
.fontBox .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fontBox .row:last-child{margin-bottom:0}
.fontBox label{font-size:14px;color:var(--mut);min-width:70px}
.fontBox select,.fontBox input[type=number]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:inherit;flex:1;min-width:100px}
.fontBox input[type=range]{flex:1;min-width:120px}

.searchIcon{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-size:18px}
.searchIcon.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.searchRow{margin:6px 0}
.searchRow input{border:1px solid #888;border-radius:10px;background:#fff;padding:10px;text-align:right;font-size:16px;width:100%;max-width:340px;color:#1d1d1d}

.zoomBtn{border:0;background:transparent;padding:2px 6px;flex:none;color:var(--mut);font-size:15px;cursor:pointer;border-radius:6px}
.zoomBtn:hover{color:var(--blue);background:rgba(31,78,140,.1)}

#zoomDlg .preview{border:1px dashed var(--ln);border-radius:10px;padding:20px;text-align:center;margin:10px 0;min-height:70px;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;word-break:break-word}
.zoomCtrls{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0;direction:ltr}
.zoomCtrls button{width:56px;height:56px;font-size:26px;font-weight:900;border-radius:14px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink2);border:1px solid var(--ln)}
.zoomCtrls button:active{transform:scale(.95)}
.zoomLvl{font-size:20px;font-weight:700;min-width:80px;text-align:center;color:var(--blue)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سجل الدرجات">
<meta name="theme-color" content="#1f5c55">
<script>try{var t=localStorage.getItem("gradesheet_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="er" id="er" hidden>تعذّر الحفظ على هذا الجهاز! أنشئ نسخة احتياطية الآن.</div>

<div id="main">
  <div class="btns">
    <button class="p" onclick="openBk()">نسخة احتياطية</button>
    <button class="wbtn" onclick="openWd()"><span class="wlogo">W</span>استيراد من Word</button>
  </div>

  <div class="scw" id="scw">
    <div id="sc" class="sc"></div>
    <button class="ib theme" id="th" onclick="toggleTheme()" aria-label="المظهر"></button>
    <button class="dots" id="dots" onclick="toggleMenu()" aria-label="المزيد">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="mn" id="mn" hidden>
      <button onclick="$('mn').hidden=true;startColEdit()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/></svg>
        تغيير الألوان
      </button>
    </div>
    <div class="sv2" id="cs" hidden>
      <button class="p" onclick="saveColors()">حفظ</button>
      <button onclick="cancelColors()">إلغاء</button>
    </div>
  </div>

  <div id="secs"></div>
  <p class="ht">الإصدار 20</p>
</div>

<div id="stu" hidden>
  <div class="top2">
    <button class="bk" onclick="home()" aria-label="رجوع"></button>
    <h2 id="sn"></h2>
  </div>
  <div class="tabs">
    <span class="tab">الملاحظات</span>
    <div style="margin-inline-start:auto;display:flex;gap:6px">
      <button class="an" style="margin:0" onclick="openMove()">نقل الطالب</button>
      <button class="an" style="margin:0" onclick="openNote()">+ إضافة ملاحظة</button>
    </div>
  </div>
  <div id="nl"></div>
</div>

<div id="lst" hidden>
  <div class="top2">
    <button class="bk" onclick="home()" aria-label="رجوع"></button>
    <h2 id="lt">إحصائيات الطلاب</h2>
  </div>
  <div id="ll"></div>
</div>

<div class="md" id="md" hidden><div class="mc">
  <h3 id="mh"></h3>
  <textarea id="nt" placeholder="اكتب الملاحظة"></textarea>
  <div class="mb">
    <button class="p" onclick="saveNote()">حفظ</button>
    <button onclick="closeNote()">إلغاء</button>
    <button class="d" id="dn" onclick="delNote()" hidden style="margin-inline-start:auto">حذف</button>
  </div>
</div></div>

<div class="md" id="as" hidden><div class="mc">
  <h3>إضافة شعبة</h3>
  <input id="ns" data-dg="i" inputmode="none" placeholder="رقم الشعبة، مثال: 105" onkeydown="if(event.key==='Enter')addSec()" style="border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:18px;color:var(--ink2);background:transparent;text-align:center">
  <div class="mb"><button class="p" onclick="addSec()">إضافة</button><button onclick="$('as').hidden=true">إلغاء</button></div>
</div></div>

<div class="md" id="bk" hidden><div class="mc">
  <h3>نسخة احتياطية</h3>
  <p class="ht" id="lb"></p>
  <div class="col">
    <button class="p" onclick="mkBackup()">إنشاء نسخة</button>
    <button onclick="$('rf').click()">استعادة نسخة</button>
    <span id="bm"></span>
  </div>
  <input type="file" id="rf" accept=".json,application/json" hidden>
  <div class="mb"><button onclick="$('bk').hidden=true">إغلاق</button></div>
</div></div>

<div class="md" id="mv" hidden><div class="mc">
  <h3>نقل الطالب إلى شعبة</h3>
  <p class="ht">ينتقل الطالب بدرجاته وملاحظاته</p>
  <div class="col" id="mvl"></div>
  <div class="mb"><button onclick="$('mv').hidden=true">إلغاء</button></div>
</div></div>

<div class="md" id="sm" hidden><div class="mc">
  <h3 id="smt"></h3>
  <div class="col">
    <input id="smn" placeholder="اسم الشعبة" style="border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:18px;color:var(--ink2);background:transparent">
    <button class="p" onclick="renSec()">تعديل اسم الشعبة</button>
    <button class="d" onclick="askDelSec2()">حذف الشعبة</button>
    <span id="smm"></span>
  </div>
  <div class="mb"><button onclick="$('sm').hidden=true">إغلاق</button></div>
</div></div>

<div class="md" id="wd" hidden><div class="mc">
  <h3>استيراد أسماء من Word</h3>
  <div class="col">
    <select id="ws" style="font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:inherit"></select>
    <button onclick="$('wf').click()">اختيار ملف Word (.docx)</button>
    <input type="file" id="wf" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <textarea id="wt" placeholder="تظهر الأسماء هنا، اسم في كل سطر"></textarea>
    <button class="p" onclick="wdAdd()">إضافة الأسماء</button>
    <span id="wm"></span>
  </div>
  <div class="mb"><button onclick="$('wd').hidden=true">إغلاق</button></div>
</div></div>

<div class="md" id="dp" hidden><div class="mc">
  <h3 id="dpt"></h3>
  <p id="dpm" style="line-height:1.8"></p>
  <div class="mb" id="dpb" style="flex-wrap:wrap"></div>
</div></div>

<div class="md" id="fd" hidden><div class="mc">
  <h3>تنسيق الخط — شعبة <span id="fdSec"></span></h3>
  <div class="fontBox">
    <div class="row">
      <label>نوع الخط:</label>
      <select id="fdFamily" onchange="applyFontLive()">
        <option value="">افتراضي</option>
        <option value="'Segoe UI',Tahoma,sans-serif">Segoe UI</option>
        <option value="Tahoma,sans-serif">Tahoma</option>
        <option value="'Noto Naskh Arabic','Arabic Typesetting',serif">نسخ عربي</option>
        <option value="'Amiri',serif">أميري</option>
        <option value="'Cairo',sans-serif">القاهرة</option>
        <option value="'Tajawal',sans-serif">تجوال</option>
        <option value="Arial,sans-serif">Arial</option>
        <option value="Georgia,serif">Georgia</option>
      </select>
    </div>
    <div class="row">
      <label>الحجم:</label>
      <input type="range" id="fdSize" min="10" max="32" step="1" value="15" oninput="applyFontLive()">
      <span id="fdSizeVal" style="min-width:50px;text-align:center;font-weight:700">15px</span>
    </div>
    <div class="row">
      <label>السماكة:</label>
      <select id="fdWeight" onchange="applyFontLive()">
        <option value="400">عادي</option>
        <option value="500">متوسط</option>
        <option value="600">شبه عريض</option>
        <option value="700">عريض</option>
        <option value="900">عريض جداً</option>
      </select>
    </div>
    <div class="row">
      <label>المحاذاة:</label>
      <select id="fdAlign" onchange="applyFontLive()">
        <option value="right">يمين</option>
        <option value="center">وسط</option>
        <option value="left">يسار</option>
      </select>
    </div>
  </div>
  <div class="mb">
    <button class="p" onclick="saveFont()">حفظ</button>
    <button onclick="cancelFont()">إلغاء</button>
  </div>
</div></div>

<div class="md" id="zoomDlg" hidden><div class="mc">
  <h3>🔍 تكبير اسم الطالب</h3>
  <p class="ht" id="zoomName"></p>
  <div class="preview" id="zoomPreview">اسم الطالب</div>
  <div class="zoomCtrls">
    <button onclick="zoomStep(-10)" aria-label="تصغير">−</button>
    <span class="zoomLvl" id="zoomLvl">100%</span>
    <button onclick="zoomStep(10)" aria-label="تكبير">+</button>
  </div>
  <div class="mb">
    <button class="p" onclick="saveZoom()">حفظ</button>
    <button onclick="resetZoom()">افتراضي</button>
    <button onclick="$('zoomDlg').hidden=true">إلغاء</button>
  </div>
</div></div>

<div id="ptr" hidden></div>
<div id="toast" hidden></div>
<div id="kp" hidden></div>

<script>
const KEY="gradesheet_v3",OP=new Set(),QO=new Set(),QS={},QM={};
try{localStorage.removeItem("gradesheet_v2")}catch(e){}

function fontStyle(si){
  const f=D.sections[si].font;
  return `font-family:${f.family||"inherit"};font-size:${f.size}px;font-weight:${f.weight};text-align:${f.align};`;
}

function secHTML(S,si){
  const fs=fontStyle(si);
  let h=`<div class="sec" id="sec${si}"><div class="sb">`;
  h+=`<button onclick="togglePanel(${si})">تعديل</button>`;
  h+=`<button class="p" onclick="addRow(${si})">+ إضافة طالب</button>`;
  h+=`<button class="searchIcon ${QO.has(si)?'on':''}" onclick="toggleSearch(${si})" title="بحث بالرقم" aria-label="بحث">🔍</button>`;
  h+=`<button class="searchIcon" onclick="openFont(${si})" title="تنسيق الخط" aria-label="تنسيق">Aa</button>`;
  h+=`</div>`;
  if(QO.has(si)){
    h+=`<div class="searchRow"><input id="q${si}" inputmode="none" data-dg="i" placeholder="ابحث برقم الطالب..." value="${esc(QS[si]||"")}" oninput="QS[${si}]=this.value;filt(${si})"></div>`;
  }
  h+=`<div class="pn" id="pn${si}" ${OP.has(si)?"":"hidden"}>`;
  h+=`<button class="d" onclick="askDelAll(${si})">حذف كل الطلاب</button>`;
  h+=`<span id="msg${si}"></span>`;
  h+=`</div>`;
  h+=`<div class="wrap"><table style="${fs}"><thead><tr><th colspan="2" class="hd">شعبة ( <input data-s="${si}" data-f="sec" value="${esc(S.sec)}" aria-label="رقم الشعبة"> )<br><input data-s="${si}" data-f="title" style="width:120px" value="${esc(S.title)}"> <input data-s="${si}" data-f="level" style="width:36px" value="${esc(S.level)}"></th>`;
  D.cols.forEach((c,i)=>{
    let mx="";
    if(c.tot)mx=`<div class="mx">(<input data-c="${i}" data-f="tm" inputmode="none" data-dg="1" value="${esc(D.totM??sumMax())}">)</div>`;
    else if(!c.txt)mx=`<div class="mx">(<input data-c="${i}" data-f="m" inputmode="none" data-dg="1" value="${esc(c.m)}">)</div>`;
    h+=`<th style="background:${c.c}">${c.txt?`<button class="stbtn" onclick="openStats(${si})">إحصائيات الطلاب</button>`:""}<input data-c="${i}" data-f="t" value="${esc(c.t)}">${mx}</th>`;
  });
  h+="</tr>";
  if(si===0)h+=`<tr class="cr"><td colspan="2">لون العمود:</td>`+D.cols.map((c,i)=>`<td><input type="color" data-c="${i}" data-f="c" value="${c.c}"></td>`).join("")+"</tr>";
  h+="</thead><tbody>";
  S.rows.forEach((r,i)=>{
    const a=`data-s="${si}" data-r="${i}"`;
    const zoom=r.zoom||1;
    h+=`<tr data-row="${i}"><td><div class="nmc">${stOf(r)?bdg(stOf(r)):""}`;
    h+=`<input ${a} data-f="n" class="ro" readonly value="${esc(r.n)}" placeholder="اسم الطالب" style="font-size:${Math.round(15*zoom)}px">`;
    h+=`<button class="zoomBtn" onclick="event.stopPropagation();openZoom(${si},${i})" title="تكبير الاسم" aria-label="تكبير">🔍</button>`;
    h+=`</div></td>`;
    h+=`<td class="nc"><input ${a} data-f="num" inputmode="none" data-dg="i" value="${esc(r.num)}"></td>`;
    D.cols.forEach(c=>{
      const bg=`style="background:${c.c}"`;
      if(c.tot)h+=`<td ${bg}>`+(r.ok?`<div class="tc"><input ${a} data-f="tot" inputmode="none" data-dg="1" value="${esc(r.tot??sumRow(r))}" style="font-weight:700"><button class="rb" title="تعديل الدرجات" onclick="reopen(${si},${i})">✎</button></div>`:`<button class="ok" onclick="confirmRow(${si},${i})">✓ تأكيد</button>`)+"</td>";
      else if(c.txt)h+=`<td ${bg}><span class="sts">${stBtns(si,i,r)}</span></td>`;
      else h+=`<td ${bg}><input ${a} data-k="${c.k}" inputmode="none" data-dg="1" value="${esc(r.s[c.k]??"")}"></td>`;
    });
    h+="</tr>";
  });
  return h+"</tbody></table></div></div>";
}

const R=(s,i)=>D.sections[s].rows[i];

function refresh(){
  document.querySelectorAll('[data-f="tot"]').forEach(el=>{const r=R(el.dataset.s,el.dataset.r);if(r.tot==null&&document.activeElement!==el)el.value=sumRow(r)});
  if(D.totM==null)document.querySelectorAll('[data-f="tm"]').forEach(el=>{if(document.activeElement!==el)el.value=sumMax()});
}

document.addEventListener("input",e=>{
  const el=e.target,d=el.dataset;
  if(d.dg){
    let c=el.value.replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[٫،,]/g,".").replace(/[^0-9.]/g,"");
    c=d.dg==="i"?c.replace(/\./g,""):c.replace(/\.(?=.*\.)/g,"");
    if(c!==el.value)el.value=c;
  }
  if(d.f==="c"||!d.f&&!d.k)return;
  if(d.r!==undefined){
    const r=R(d.s,d.r);
    if(d.k)r.s[d.k]=el.value;
    else if(d.f==="tot")r.tot=el.value===""?null:el.value;
    else r[d.f]=el.value;
  } else if(d.c!==undefined){
    if(d.f==="tm")D.totM=el.value===""?null:el.value;
    else D.cols[d.c][d.f]=el.value;
    document.querySelectorAll(`[data-c="${d.c}"][data-f="${d.f}"]`).forEach(x=>{if(x!==el)x.value=el.value});
  } else if(d.s!==undefined){
    D.sections[d.s][d.f]=el.value;
    if(d.f==="sec")buildSc();
  }
  save();refresh();
});

document.addEventListener("change",e=>{

async function shareFile(name,text,type){
  const f=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  return true;
}

const kpEl=$("kp");
kpEl.innerHTML=["1","2","3","4","5","6","7","8","9","0"].map(k=>`<button type="button" data-kp="${k}">${k}</button>`).join("")+'<button type="button" id="kdot" data-kp=".">.</button><button type="button" class="kx" data-kp="bs">⌫</button><button type="button" class="kx" id="kup" data-kp="up">↑</button><button type="button" class="kx" id="kdn" data-kp="dn">↓</button><button type="button" class="kx" data-kp="ok">تم</button>';

function showKp(el){
  kpEl.hidden=false;
  document.body.classList.add("kp");
  const g=el.dataset.r!==undefined;
  $("kdn").hidden=!g;
  $("kup").hidden=!g;
  $("kdot").hidden=el.dataset.dg==="i";
  setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),60);
}
function hideKp(){kpEl.hidden=true;document.body.classList.remove("kp")}
const ke=()=>{const a=document.activeElement;return a&&a.dataset&&a.dataset.dg?a:null};

document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.dg)showKp(t);
});

/* منع فقدان التركيز عند الضغط على الكيبورد */
["pointerdown","touchstart","mousedown","click"].forEach(evt => {
  kpEl.addEventListener(evt, e => {
    if(e.target.closest("button")) { e.preventDefault(); e.stopPropagation(); }
  }, {passive:false});
});

kpEl.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  e.preventDefault();
  e.stopPropagation();
  kpPress(b.dataset.kp);
});

document.addEventListener("click",e=>{
  if(kpEl.hidden)return;
  if(kpEl.contains(e.target))return;
  const a=ke();
  if(!a)return;
  if(e.target===a)return;
  if(e.target.dataset&&e.target.dataset.dg)return;
  setTimeout(()=>{if(!ke())hideKp()},50);
});

function kpPress(k){
  const el=ke();
  if(!el)return;
  if(k==="ok"){el.blur();hideKp();return}
  if(k==="up"||k==="dn"){
    const d=el.dataset,dir=k==="up"?-1:1;
    const col=d.k?`[data-k="${d.k}"]`:`[data-f="${d.f}"]`;
    const len=D.sections[d.s].rows.length;
    for(let r=+d.r+dir;r>=0&&r<len;r+=dir){
      const n=document.querySelector(`input[data-s="${d.s}"][data-r="${r}"]${col}`);
      if(n&&!n.closest("tr").hidden){n.focus();return}
    }
    return;
  }
  const s=el.selectionStart??el.value.length,e2=el.selectionEnd??s;
  if(k==="bs"){if(s!==e2)el.setRangeText("",s,e2,"end");else if(s>0)el.setRangeText("",s-1,s,"end");else return}
  else el.setRangeText(k,s,e2,"end");
  el.dispatchEvent(new Event("input",{bubbles:true}));
}

function applyFontLive(){
  const f={
    family:$("fdFamily").value,

    weight:+$("fdWeight").value,
    align:$("fdAlign").value
  };
  $("fdSizeVal").textContent=f.size+"px";

    }

}

/* ============ البحث ============ */
function toggleSearch(si){
  if(QO.has(si)){QO.delete(si);QS[si]=""}
  else{QO.add(si);QS[si]=""}
  render();
  if(QO.has(si))setTimeout(()=>{const q=$("q"+si);if(q)q.focus()},50);
}
function filt(si){
  const on=QO.has(si);
  const q=on?String(QS[si]||"").replace(/\D/g,""):"";
  document.querySelectorAll(`#sec${si} tbody tr`).forEach(tr=>{
    const r=D.sections[si]&&D.sections[si].rows[tr.dataset.row];
    tr.hidden=!!q&&!!r&&!String(r.num).startsWith(q);
  });

/* ============ قراءة Word ============ */
async function readDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
  let e=buf.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw 0;
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const nm=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));
    if(nm==="word/document.xml"){
      const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=buf.subarray(st,st+cs);
      if(m===0)return new TextDecoder().decode(data);
      const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
      w.write(data);w.close();
      return await new Response(ds.readable).text();
    }
    p+=46+nl+xl+cl;
  }
  throw 0;
}
function docxLines(xml){
  const x=new DOMParser().parseFromString(xml,"application/xml"),out=[];
  [...x.getElementsByTagName("w:p")].forEach(p=>{
    let t=[...p.getElementsByTagName("w:t")].map(n=>n.textContent).join("").replace(/\s+/g," ").trim();
    t=t.replace(/^[\s\d٠-٩]+[.\-–)\]:،]+\s*/,"").trim();
    if(!t||/^[\s\d٠-٩.\-–—()\/:,،]+$/.test(t)||/^(الاسم|اسم الطالب|أسماء الطلاب|اسماء الطلاب|م|الرقم|التسلسل)$/.test(t))return;
    out.push(t);
  });
  return out;
}
function openWd(){$("ws").innerHTML=D.sections.map((S,i)=>`<option value="${i}">شعبة ${esc(S.sec)}</option>`).join("");$("wt").value="";$("wm").textContent="";$("wd").hidden=false}
$("wf").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const L=docxLines(await readDocx(f));
    $("wt").value=L.join("\n");
    $("wm").textContent=L.length?"وُجد "+L.length+" اسم. راجعها ثم اضغط «إضافة الأسماء»":"لم أجد أسماء في الملف";
  }catch(err){$("wm").textContent="تعذّر قراءة الملف. تأكد أنه بصيغة docx"}
});
function addNames(S,list){
  let j=0;
  list.forEach(n=>{while(j<S.rows.length&&S.rows[j].n)j++;if(j<S.rows.length)S.rows[j].n=n;else S.rows.push({...blank(S.rows.length),n});j++});
  sortRows(S);renum(D.sections.indexOf(S));save();render();$("wd").hidden=true;toast("تمت إضافة "+list.length+" اسم ✓");
}
function wdAdd(){
  const S=D.sections[$("ws").value];if(!S)return;
  const L=$("wt").value.split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  if(!L.length){$("wm").textContent="لا توجد أسماء";return}
  const seen=new Set(),dups=[],ok=[];
  L.forEach(n=>{const k=nk(n);if(seen.has(k)||D.sections.some(T=>T.rows.some(r=>nk(r.n)===k)))dups.push(n);else ok.push(n);seen.add(k)});
  if(dups.length)dlg("أسماء مكررة",`وُجد ${dups.length} اسم مكرر:<br>`+dups.slice(0,8).map(esc).join("<br>")+(dups.length>8?"<br>…":""),[["تخطي المكرر","p",()=>addNames(S,ok)],["إضافتها أيضاً","",()=>addNames(S,L)],["إلغاء","",null]]);
  else addNames(S,L);
}

  D.sections.forEach(S=>S.rows.forEach(r=>{if(r.st){r.h=r.h||{};r.h[D.stDay||k]=r.st;delete r.st}}));

/* ============ السحب للتحديث ============ */
let py=0,pd=0,pulling=false;
function showPull(d){const p=$("ptr");p.hidden=false;p.style.opacity=Math.min(1,d/70);p.textContent=d>90?"أفلت للتحديث":"اسحب للأسفل للتحديث"}
function hidePull(){$("ptr").hidden=true}
document.addEventListener("touchstart",e=>{if(window.scrollY<=0&&e.touches.length===1&&!document.body.classList.contains("kp")&&!document.querySelector(".md:not([hidden])")){py=e.touches[0].clientY;pulling=true;pd=0}},{passive:true});
document.addEventListener("touchmove",e=>{if(!pulling)return;pd=e.touches[0].clientY-py;if(pd>12&&window.scrollY<=0)showPull(pd);else hidePull()},{passive:true});
document.addEventListener("touchend",()=>{if(!pulling)return;pulling=false;if(pd>90)doRefresh();else hidePull()});
async function doRefresh(){
  const p=$("ptr");p.style.opacity=1;p.hidden=false;
  if(!navigator.onLine){p.textContent="لا يوجد اتصال بالإنترنت";setTimeout(hidePull,1800);return}
  p.textContent="جارٍ التحديث…";
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(reg){await reg.update();await new Promise(r=>setTimeout(r,2500))}
    checkDay();p.textContent="لديك أحدث إصدار ✓";
  }catch(e){p.textContent="تعذّر التحديث"}
  setTimeout(hidePull,1800);
}

function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2400)}
function norm(s){return String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim().toLowerCase()}
