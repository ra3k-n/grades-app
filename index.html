<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدرجات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f3f0;--ink:#1d1d1d;--line:#555;--btn:#fff;--acc:#1f5c55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a19;--btn:#242b29}}
:root[data-theme="dark"]{--bg:#161a19;--btn:#242b29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:12px;color:#e8e8e8}
@media (prefers-color-scheme:light){body{color:#1d1d1d}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid #888;background:var(--btn);color:inherit;border-radius:8px;padding:8px 14px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:#d2463d;border-color:#d2463d}
.pn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid #888;border-radius:10px;padding:10px;margin-bottom:10px}
.pn[hidden]{display:none}
.pn input{width:70px;border:1px solid #888;border-radius:6px;background:#fff;color:#1d1d1d;padding:6px;text-align:center;font:inherit}
.wrap{overflow-x:auto;border:1px solid var(--line);background:#fff;color:var(--ink)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{border:1px solid var(--line);padding:0;text-align:center;color:var(--ink)}
input{font:inherit;color:#1d1d1d;background:transparent;border:0;padding:6px 2px;text-align:center;width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--acc);background:#fff}
th input{font-weight:700}
.hd{background:#e4e4e4;padding:6px 8px;font-weight:700;line-height:1.9}
.hd input{display:inline-block;width:56px;border-bottom:1px dashed #888;font-weight:700}
.mx{display:flex;justify-content:center;align-items:center;color:#c0182b;font-weight:700;padding-bottom:2px}
.mx input{width:44px;color:#c0182b;padding:2px}
.nmc{display:flex;align-items:center;min-width:200px}
.nmc input{text-align:right;padding-inline:8px}
.x,.rb{border:0;background:transparent;padding:4px 8px;flex:none}
.x{color:#b4372f}.rb{color:#555}
.nc{width:48px;background:#ececec}
.tc{display:flex;align-items:center}
.ok{border:0;background:transparent;color:var(--acc);font-weight:700;width:100%;padding:8px 4px;color:#1f5c55}
.cr{display:none}.pick .cr{display:table-row}
.cr td{background:#fff;padding:4px}
.cr input[type=color]{width:44px;height:28px;padding:0;border:1px solid #888;cursor:pointer}

:root{--card:#fff;--ink2:#1d1d1d;--mut:#6b6b6b;--blue:#1f4e8c;--ln:#d9d9d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#242b29;--ink2:#e8e8e8;--mut:#9aa8a5;--blue:#8dbbf5;--ln:#3a4543}}
:root[data-theme="dark"]{--card:#242b29;--ink2:#e8e8e8;--mut:#9aa8a5;--blue:#8dbbf5;--ln:#3a4543}
[hidden]{display:none!important}
input{touch-action:manipulation}
.btns{position:relative}
.dots{margin-inline-start:auto;padding:8px 10px}
.mn{position:absolute;left:0;top:46px;z-index:20;background:var(--card);color:var(--ink2);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:6px;min-width:200px}
.mn button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px;font-size:17px;color:inherit}
.top2{display:flex;align-items:center;justify-content:center;position:relative;min-height:44px;margin-bottom:6px}
.top2 .bk{position:absolute;right:0;border:0;background:transparent;padding:8px;color:inherit}
.top2 h2{margin:0;font-size:20px;font-weight:600}
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--ln);margin-bottom:10px}
.tab{padding:10px 8px;font-weight:700;color:var(--blue);border-bottom:3px solid var(--blue);margin-bottom:-1px}
.tabs .an{margin-inline-start:auto;border:0;background:transparent;color:var(--blue);font-weight:600}
.emp{text-align:center;color:var(--mut);padding:90px 0}
.nc2{background:var(--card);color:var(--ink2);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.14);cursor:pointer}
.nc2 small{display:block;color:var(--mut);margin-top:6px}
.ht{color:var(--mut);font-size:14px;margin:8px 0 6px}
#ll{list-style:none;margin:0;padding:0}
#ll li{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--ln);font-size:18px;background:var(--bg)}
#ll li.dg{background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:10px}
.hg{touch-action:none;cursor:grab;color:var(--mut);padding:4px;display:flex}
.md{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.mc{background:var(--card);color:var(--ink2);border-radius:16px;padding:16px;width:100%;max-width:420px}
.mc h3{margin:0 0 10px}
.mc textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;border:1px solid var(--ln);border-radius:10px;padding:10px;background:transparent;color:inherit}
.mb{display:flex;gap:8px;margin-top:10px}
.sec{margin-bottom:24px}.sb{display:flex;gap:8px;margin-bottom:6px}.sb button{padding:6px 12px}
#ll ul{list-style:none;margin:0 0 12px;padding:0}.ht2{font-weight:700;color:var(--blue);margin:14px 0 2px}
.btns #ns{width:110px;border:1px solid #888;border-radius:8px;background:#fff;padding:8px}
.cc{margin-inline-start:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);flex:none;cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.sw span{width:38px;height:38px;border-radius:50%;border:2px solid var(--mut);cursor:pointer}.sw span.on{outline:3px solid var(--blue);outline-offset:2px}
#cc{width:44px;height:30px;padding:0;border:1px solid #888;vertical-align:middle}
.col{display:flex;flex-direction:column;gap:8px}
.er{background:#b4372f;color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.mc select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:inherit}
.mc{max-height:90vh;overflow:auto}
.sv{position:absolute;left:0;display:flex;gap:6px}
.crow{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.crow .cc{margin:0}
.top2 h2{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn select{font:inherit;padding:6px;border-radius:6px;border:1px solid #888;background:#fff;color:#1d1d1d}
.sv2{position:absolute;left:0;top:48px;z-index:15;display:flex;gap:6px}
.sv2 button{box-shadow:0 2px 8px rgba(0,0,0,.3)}
body.kp{padding-bottom:96px}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#d3d6d4;border-top:1px solid #888;direction:ltr}
#kp[hidden]{display:none}
#kp button{flex:1;font-size:22px;padding:12px 0;border-radius:8px;background:#fff;color:#111;border:1px solid #999;touch-action:manipulation}
#kp button.kx{background:#e9ecea;font-size:17px;flex:1.3}
.sc{display:flex;gap:12px;overflow-x:auto;margin:28px 0 14px;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sc button{flex:none;font-size:22px;font-weight:700;padding:14px 28px;border-radius:14px;background:var(--acc);color:#fff;border-color:var(--acc)}
.sec{scroll-margin-top:100px}
.sc{gap:14px;margin:38px 0 20px}
.sc button{font-size:16px;font-weight:700;padding:7px 20px;border-radius:999px;background:#1f4e8c;border-color:#1f4e8c;color:#fff;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ll{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1000px){#ll{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lc .ht2{margin-top:0;padding-bottom:6px;border-bottom:2px solid var(--blue)}
.lr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 2px;border-bottom:1px solid var(--ln)}
.ln{font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.sts{display:flex;gap:5px;flex:none}
.st{width:34px;height:34px;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;opacity:.4}
.st.on{opacity:1;outline:3px solid var(--ink2);outline-offset:2px}
.st-p{background:#34c759}.st-a{background:#ff3b30}.st-l{background:#ff9500}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;flex:none;margin-inline:4px;vertical-align:middle}
.bdg svg{width:14px;height:14px}
.scw{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:38px 0 20px;padding:8px 0}
.scw .sc{position:static;margin:0;padding:0;flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
button:disabled{opacity:.35}
.qb{margin-bottom:6px}.qb input{border:1px solid #888;border-radius:10px;background:#fff;padding:10px;text-align:right;font-size:16px;max-width:340px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:60;background:#1f5c55;color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.wrap .st{width:30px;height:30px}
td .sts{justify-content:center}
.cn{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px 3px 8px;color:#fff;font-size:15px;font-weight:700}
.cn svg{width:14px;height:14px}
#wt{min-height:150px}
.wbtn{background:#2b579a;border-color:#2b579a;color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;border-radius:10px}
.wlogo{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;background:#fff;color:#2b579a;font:900 16px Georgia,serif}
.sc2{margin:12px 0 16px}
.lc{scroll-margin-top:100px}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:70;background:#1f4e8c;color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<div class="er" id="er" hidden>تعذّر الحفظ على هذا الجهاز! أنشئ نسخة احتياطية الآن.</div><div id="main"><div class="btns"><div class="sv2" id="cs" hidden><button class="p" onclick="saveColors()">حفظ</button><button onclick="cancelColors()">إلغاء</button></div><button class="p" onclick="openBk()">نسخة احتياطية</button><button class="wbtn" onclick="openWd()"><span class="wlogo">W</span>استيراد من Word</button>
 <button class="dots" id="dots" onclick="toggleMenu()" aria-label="المزيد"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
 <div class="mn" id="mn" hidden><button onclick="openList()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>إحصائيات الطلاب</button>
 <button onclick="$('mn').hidden=true;askSec()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>إضافة شعبة</button>
 <button onclick="$('mn').hidden=true;startColEdit()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/></svg>تغيير الألوان</button></div></div><div class="scw"><div id="sc" class="sc"></div></div><div id="secs"></div><p class="ht">اضغط مرتين على اسم الطالب لفتح ملاحظاته · الإصدار 16</p></div>
<div id="stu" hidden><div class="top2"><button class="bk" onclick="home()" aria-label="رجوع"></button><h2 id="sn"></h2><div class="sv" id="sv" hidden><button class="p" onclick="saveCol()">حفظ</button><button onclick="cancelCol()">إلغاء</button></div></div>
<div class="crow"><span>لون الطالب</span><span id="pv" class="cc" onclick="toggleCp()" title="تغيير اللون"></span></div>
<div id="cpn" hidden><div id="sw" class="sw"></div><div class="mb" style="align-items:center"><label>لون مخصص <input type="color" id="cc"></label><button onclick="pickCol('')">بدون لون</button></div></div>
<div class="tabs"><span class="tab">الملاحظات</span><div style="margin-inline-start:auto;display:flex;gap:6px"><button class="an" style="margin:0" onclick="openMove()">نقل الطالب</button><button class="an" style="margin:0" onclick="openNote()">+ إضافة ملاحظة</button></div></div><div id="nl"></div></div>
<div id="lst" hidden><div class="top2"><button class="bk" onclick="home()" aria-label="رجوع"></button><h2>إحصائيات الطلاب</h2></div><div id="sc2" class="sc sc2"></div><div id="ll"></div></div>
<div class="md" id="md" hidden><div class="mc"><h3 id="mh"></h3><textarea id="nt" placeholder="اكتب الملاحظة"></textarea>
<div class="mb"><button class="p" onclick="saveNote()">حفظ</button><button onclick="closeNote()">إلغاء</button><button class="d" id="dn" onclick="delNote()" hidden style="margin-inline-start:auto">حذف</button></div></div></div>

<div class="md" id="as" hidden><div class="mc"><h3>إضافة شعبة</h3><input id="ns" data-dg="i" inputmode="none" placeholder="رقم الشعبة، مثال: 105" onkeydown="if(event.key==='Enter')addSec()" style="border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:18px;color:var(--ink2);background:transparent"><div class="mb"><button class="p" onclick="addSec()">إضافة</button><button onclick="$('as').hidden=true">إلغاء</button></div></div></div>
<div class="md" id="bk" hidden><div class="mc"><h3>نسخة احتياطية</h3><p class="ht" id="lb"></p>
<div class="col"><button class="p" onclick="mkBackup()">إنشاء نسخة</button><button onclick="$('rf').click()">استعادة نسخة</button><span id="bm"></span></div>
<input type="file" id="rf" accept=".json,application/json" hidden>
<div class="mb"><button onclick="$('bk').hidden=true">إغلاق</button></div></div></div>

<div class="md" id="mv" hidden><div class="mc"><h3>نقل الطالب إلى شعبة</h3><p class="ht">ينتقل الطالب بدرجاته وملاحظاته ولونه</p><div class="col" id="mvl"></div><div class="mb"><button onclick="$('mv').hidden=true">إلغاء</button></div></div></div>
<div class="md" id="sm" hidden><div class="mc"><h3 id="smt"></h3><div class="col">
<input id="smn" placeholder="اسم الشعبة" style="border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:18px;color:var(--ink2);background:transparent">
<button class="p" onclick="renSec()">تعديل اسم الشعبة</button><button class="d" onclick="askDelSec2()">حذف الشعبة</button><span id="smm"></span></div>
<div class="mb"><button onclick="$('sm').hidden=true">إغلاق</button></div></div></div>
<div class="md" id="wd" hidden><div class="mc"><h3>استيراد أسماء من Word</h3><div class="col">
<select id="ws"></select>
<button onclick="$('wf').click()">اختيار ملف Word (.docx)</button>
<input type="file" id="wf" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<textarea id="wt" placeholder="تظهر الأسماء هنا، اسم في كل سطر. يمكنك التعديل أو اللصق"></textarea>
<button class="p" onclick="wdAdd()">إضافة الأسماء</button><span id="wm"></span></div>
<div class="mb"><button onclick="$('wd').hidden=true">إغلاق</button></div></div></div>
<div class="md" id="dp" hidden><div class="mc"><h3 id="dpt"></h3><p id="dpm" style="line-height:1.8"></p><div class="mb" id="dpb" style="flex-wrap:wrap"></div></div></div>
<div id="ptr" hidden></div>
<div id="toast" hidden></div>
<div id="kp" hidden></div>
<script>
const KEY="gradesheet_v3",OP=new Set(),QO=new Set(),QS={};try{localStorage.removeItem("gradesheet_v2")}catch(e){}
const blank=i=>({n:"",num:String(i+1),s:{},tot:null,ok:false,notes:[]});
const newSec=(sec,n)=>({sec,title:"كفايات لغوية",level:"1",rows:Array.from({length:n},(_,i)=>blank(i))});
const COLS=()=>[{k:"act",t:"نشاط صفي",m:"15",c:"#e2e2d2",s:1},{k:"par",t:"مشاركة",m:"10",c:"#e2e2d2",s:1},{k:"hw",t:"واجب",m:"15",c:"#f4d3d6",s:1},{k:"tot",t:"المجموع",c:"#f6d9c8",tot:1},{k:"t1",t:"اختبار الفترة الأولى /",m:"20",c:"#f0eecf"},{k:"t2",t:"اختبار الفترة الثانية /",m:"20",c:"#cfe2ee"},{k:"nt",t:"م",c:"#cfe2ee",txt:1}];
let D=null;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D)D={cols:COLS(),totM:null,sections:["101","102","103","104","206"].map(x=>newSec(x,5))};
if(!D.sections){D.sections=[{sec:D.sec,title:D.title,level:D.level,rows:D.rows||[]}];delete D.rows}
const save=()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){ok=false}const b=document.getElementById("er");if(b)b.hidden=ok};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const num=v=>parseFloat(v)||0,$=id=>document.getElementById(id);
const sumRow=r=>D.cols.reduce((a,c)=>a+(c.s?num(r.s[c.k]):0),0);
const sumMax=()=>D.cols.reduce((a,c)=>a+(c.s?num(c.m):0),0);
const SV=d=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
document.querySelectorAll(".bk").forEach(b=>b.innerHTML=SV('<path d="M9 5l7 7-7 7"/>'));
function render(){hideKp();buildSc();$("secs").innerHTML=D.sections.map(secHTML).join("");D.sections.forEach((S,i)=>filt(i))}
function secHTML(S,si){
 let h=`<div class="sec" id="sec${si}"><div class="sb"><button onclick="togglePanel(${si})">✎ تعديل الطلاب</button><button class="p" onclick="addRow(${si})">+ إضافة طالب</button><button onclick="toggleQ(${si})" aria-label="بحث">${SV('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>')}</button></div>
 <div class="qb" id="qb${si}" ${QO.has(si)?"":"hidden"}><input id="q${si}" placeholder="ابحث عن اسم" value="${esc(QS[si]||"")}" oninput="QS[${si}]=this.value;filt(${si})"></div>
 <div class="pn" id="pn${si}" ${OP.has(si)?"":"hidden"}><label>عدد الطلاب</label><input id="cnt${si}" data-dg="i" inputmode="none" value="${S.rows.length}"><button class="p" onclick="applyCnt(${si})">تطبيق</button><button class="d" onclick="askDelAll(${si})">حذف كل الطلاب</button><span id="msg${si}"></span></div>
 <div class="wrap"><table><thead><tr><th colspan="2" class="hd">شعبة ( <input data-s="${si}" data-f="sec" value="${esc(S.sec)}" aria-label="رقم الشعبة"> )<br><input data-s="${si}" data-f="title" style="width:120px" value="${esc(S.title)}"> <input data-s="${si}" data-f="level" style="width:36px" value="${esc(S.level)}"></th>`;
 D.cols.forEach((c,i)=>{
  let mx="";
  if(c.tot)mx=`<div class="mx">(<input data-c="${i}" data-f="tm" inputmode="none" data-dg="1" value="${esc(D.totM??sumMax())}">)</div>`;
  else if(!c.txt)mx=`<div class="mx">(<input data-c="${i}" data-f="m" inputmode="none" data-dg="1" value="${esc(c.m)}">)</div>`;
  h+=`<th style="background:${c.c}"><input data-c="${i}" data-f="t" value="${esc(c.t)}">${mx}</th>`});
 h+="</tr>";
 if(si===0)h+=`<tr class="cr"><td colspan="2">لون العمود:</td>`+D.cols.map((c,i)=>`<td><input type="color" data-c="${i}" data-f="c" value="${c.c}"></td>`).join("")+"</tr>";
 h+="</thead><tbody>";

function tally(r){const c={p:0,a:0,l:0};Object.values(r.h||{}).forEach(v=>{if(c[v]!==undefined)c[v]++});return c}
function stBtns(s,i,r){const t=stOf(r);return["p","a","l"].map(k=>`<button class="st st-${k}${t===k?" on":""}" onclick="setSt(${s},${i},'${k}')" aria-label="${STN[k]}">${SV(STI[k])}</button>`).join("")}
function refreshSt(s,i){const tr=document.querySelector(`#sec${s} tr[data-row="${i}"]`);if(!tr)return;const r=R(s,i),k=stOf(r),w=tr.querySelector(".sts");if(w)w.innerHTML=stBtns(s,i,r);const m=tr.querySelector(".nmc");if(m){const o=m.querySelector(".bdg");if(o)o.remove();if(k)m.insertAdjacentHTML("afterbegin",bdg(k))}}
const nk=s=>norm(s).replace(/\s+/g," ");
function dlg(t,h,btns){$("dpt").textContent=t;$("dpm").innerHTML=h;const b=$("dpb");b.innerHTML="";btns.forEach(([n,c,f])=>{const x=document.createElement("button");x.textContent=n;if(c)x.className=c;x.onclick=()=>{$("dp").hidden=true;if(f)f()};b.appendChild(x)});$("dp").hidden=false}
function findDup(row,name){const k=nk(name);if(!k)return null;for(const S of D.sections)for(const r of S.rows)if(r!==row&&nk(r.n)===k)return S;return null}
let dupRow=null;
function dupEdit(){if(!dupRow)return;const s=D.sections.findIndex(S=>S.rows.includes(dupRow));if(s<0)return;const i=D.sections[s].rows.indexOf(dupRow),inp=document.querySelector(`input[data-s="${s}"][data-r="${i}"][data-f="n"]`);if(inp){inp.focus();inp.select()}}
document.addEventListener("change",e=>{const d=e.target.dataset;if(d&&d.f==="n"&&d.r!==undefined){const row=R(d.s,d.r),S=findDup(row,row.n);if(S){dupRow=row;dlg("اسم مكرر",`الاسم <b>${esc(row.n.trim())}</b> موجود مسبقاً في شعبة ${esc(S.sec)}.`,[["تعديل الاسم","p",dupEdit],["إبقاؤه","",null]])}}});
async function readDocx(file){
 const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
 let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw 0;
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const nm=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));
  if(nm==="word/document.xml"){
   const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=buf.subarray(st,st+cs);
   if(m===0)return new TextDecoder().decode(data);
   const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(data);w.close();
   return await new Response(ds.readable).text()}
  p+=46+nl+xl+cl}
 throw 0}
function docxLines(xml){const x=new DOMParser().parseFromString(xml,"application/xml"),out=[];
 [...x.getElementsByTagName("w:p")].forEach(p=>{
  let t=[...p.getElementsByTagName("w:t")].map(n=>n.textContent).join("").replace(/\s+/g," ").trim();
  t=t.replace(/^[\s\d٠-٩]+[.\-–)\]:،]+\s*/,"").trim();
  if(!t||/^[\s\d٠-٩.\-–—()\/:,،]+$/.test(t)||/^(الاسم|اسم الطالب|أسماء الطلاب|اسماء الطلاب|م|الرقم|التسلسل)$/.test(t))return;
  out.push(t)});return out}
function openWd(){$("ws").innerHTML=D.sections.map((S,i)=>`<option value="${i}">شعبة ${esc(S.sec)}</option>`).join("");$("wt").value="";$("wm").textContent="";$("wd").hidden=false}
$("wf").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const L=docxLines(await readDocx(f));$("wt").value=L.join("\n");$("wm").textContent=L.length?"وُجد "+L.length+" اسم. راجعها ثم اضغط «إضافة الأسماء»":"لم أجد أسماء في الملف"}
 catch(err){$("wm").textContent="تعذّر قراءة الملف. تأكد أنه بصيغة docx (احفظه من Word بصيغة .docx)"}});
function addNames(S,list){let j=0;list.forEach(n=>{while(j<S.rows.length&&S.rows[j].n)j++;if(j<S.rows.length)S.rows[j].n=n;else S.rows.push({...blank(S.rows.length),n});j++});
 sortRows(S);renum(D.sections.indexOf(S));save();render();$("wd").hidden=true;toast("تمت إضافة "+list.length+" اسم ✓")}
function wdAdd(){const S=D.sections[$("ws").value];if(!S)return;
 const L=$("wt").value.split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
 if(!L.length){$("wm").textContent="لا توجد أسماء";return}
 const seen=new Set(),dups=[],ok=[];
 L.forEach(n=>{const k=nk(n);if(seen.has(k)||D.sections.some(T=>T.rows.some(r=>nk(r.n)===k)))dups.push(n);else ok.push(n);seen.add(k)});
 if(dups.length)dlg("أسماء مكررة",`وُجد ${dups.length} اسم مكرر:<br>`+dups.slice(0,8).map(esc).join("<br>")+(dups.length>8?"<br>…":""),[["تخطي المكرر","p",()=>addNames(S,ok)],["إضافتها أيضاً","",()=>addNames(S,L)],["إلغاء","",null]]);
 else addNames(S,L)}
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function checkDay(){const k=dayKey();
 D.sections.forEach(S=>S.rows.forEach(r=>{if(r.st){r.h=r.h||{};r.h[D.stDay||k]=r.st;delete r.st}}));
 if(D.stDay===k)return;
 D.stDay=k;save();render();
 if(!$("lst").hidden)buildList();if(!$("stu").hidden)renderStu()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
setInterval(checkDay,60000);
checkDay();
render();
</script>
