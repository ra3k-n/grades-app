<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدرجات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5c55'/%3E%3Ctext x='32' y='46' font-size='38' font-weight='900' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%D8%B3%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سجل الدرجات">
<meta name="theme-color" content="#1f5c55">
<script>try{var t=localStorage.getItem('gradesheet_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#f5f5f2; --bg2:#ffffff; --card:#ffffff;
  --ink:#1a1a1a; --ink2:#2d2d2d; --mut:#6b6b6b;
  --line:#d4d4cf; --line2:#b8b8b0;
  --accent:#1f5c55; --accent2:#2a7a70;
  --blue:#1f4e8c; --green:#22a854;
  --red:#e63946; --orange:#f59e0b; --gold:#b8860b;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow2:0 4px 16px rgba(0,0,0,.1);
  --top-1:56px; --top-2:60px;
  --top-total:calc(var(--top-1) + var(--top-2));
  --bot:56px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1413; --bg2:#1a1f1e; --card:#1e2624;
    --ink:#e8ede9; --ink2:#d0d6d2; --mut:#8a938f;
    --line:#2d3835; --line2:#3d4946;
    --accent:#3a9a8c; --accent2:#4aab9c;
    --blue:#5b9be5;
    --shadow:0 2px 8px rgba(0,0,0,.3);
    --shadow2:0 4px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1413; --bg2:#1a1f1e; --card:#1e2624;
  --ink:#e8ede9; --ink2:#d0d6d2; --mut:#8a938f;
  --line:#2d3835; --line2:#3d4946;
  --accent:#3a9a8c; --accent2:#4aab9c;
  --blue:#5b9be5;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --shadow2:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-top:calc(var(--top-total) + env(safe-area-inset-top,0px) + 8px);
  padding-bottom:calc(52px + env(safe-area-inset-bottom, 0px) + 10px);
  padding-inline:10px;
  transition:background-color .3s,color .3s;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

.topbar{
  position:fixed; top:0; left:0; right:0;
  z-index:200;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--card);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);
}
.topbar-row-1{
  height:var(--top-1);
  display:flex; align-items:center; gap:8px;
  padding-inline:10px;
}
.brand{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
  font-weight:800; font-size:15px; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-icon{
  width:32px; height:32px; border-radius:8px; flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid; place-items:center; color:#fff; font-weight:900; font-size:16px;
}
.icon-btn{
  width:42px; height:42px; border-radius:50%; flex:none;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s;
}
.icon-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.menu-dropdown{
  position:absolute; top:calc(var(--top-1) + env(safe-area-inset-top,0px) + 6px);
  left:12px; right:auto;
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow2);
  padding:6px; min-width:210px; z-index:300;
}
.menu-dropdown[hidden]{display:none}
.menu-dropdown button,
.menu-dropdown a{
  display:flex; align-items:center; gap:10px;
  width:100%; padding:12px; border:none; background:transparent;
  color:var(--ink); font:inherit; font-size:15px; font-weight:600;
  border-radius:10px; cursor:pointer; text-decoration:none; text-align:right;
}
.menu-dropdown button:hover,
.menu-dropdown a:hover{background:var(--accent); color:#fff}
.menu-dropdown svg{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.topbar-row-2{
  height:var(--top-2);
  display:flex; align-items:center; gap:8px;
  padding-inline:10px;
  border-top:1px solid var(--line);
  overflow-x:auto;
  scrollbar-width:none;
}
.topbar-row-2::-webkit-scrollbar{display:none}
.action-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:9px 16px; font:inherit; font-size:14px; font-weight:700;
  border-radius:10px; cursor:pointer; border:1px solid var(--line);
  background:var(--card); color:var(--ink);
  white-space:nowrap; flex:none; transition:.15s;
}
.action-btn:active{transform:scale(.96)}
.action-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.action-btn.blue{background:var(--blue); color:#fff; border-color:var(--blue)}
.action-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}

.hero{
  position:relative;
  margin-top:8px;
  padding:38px 16px 38px;
  text-align:center;
  border-radius:16px;
  background-image:url('header-bg.png');
  background-size:cover;
  background-position:center;
  overflow:hidden;
}
.hero::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(245,245,242,.85) 0%,
    rgba(245,245,242,.55) 50%,
    rgba(245,245,242,.85) 100%);
  z-index:1;
}
:root[data-theme="dark"] .hero::before{
  background:linear-gradient(180deg,
    rgba(15,20,19,.88) 0%,
    rgba(15,20,19,.6) 50%,
    rgba(15,20,19,.88) 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hero::before{
    background:linear-gradient(180deg,
      rgba(15,20,19,.88) 0%,
      rgba(15,20,19,.6) 50%,
      rgba(15,20,19,.88) 100%);
  }
}
.hero h1,.hero p{position:relative; z-index:2}
.hero h1{font-size:30px; font-weight:900; margin:0; color:var(--accent); letter-spacing:-.5px}
.hero p{margin:8px 0 0; color:var(--ink2); font-size:13px; font-weight:600}

.sections-strip{
  position:sticky;
  top:calc(var(--top-total) + env(safe-area-inset-top,0px));
  z-index:150;
  background:var(--bg);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  display:flex; gap:10px;
  overflow-x:auto; padding:14px 4px 6px;
  scrollbar-width:none; align-items:center;
  margin-top:10px;
}
.sections-strip::-webkit-scrollbar{display:none}
.sec-btn{
  flex:none;
  background:var(--accent); color:#fff; border:none;
  border-radius:999px; padding:9px 22px;
  font:inherit; font-weight:700; font-size:15px;
  cursor:pointer; white-space:nowrap;
  transition:transform .15s; user-select:none; -webkit-user-select:none; line-height:1;
}
.sec-btn:active{transform:scale(.95)}
.sec-btn.add{background:var(--blue); font-size:17px; padding:9px 20px}

.btn{
  font:inherit; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:10px; padding:9px 16px;
  font-size:13px; font-weight:700;
  display:inline-flex; align-items:center; gap:6px;
  transition:.15s;
}
.btn:hover{background:var(--bg2); filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.danger{color:var(--red); border-color:var(--red)}
.btn.danger:hover{background:var(--red); color:#fff}
.btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}

.section-card{
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; margin-top:10px; margin-bottom:24px;
  overflow:visible;
  box-shadow:var(--shadow);
}
.section-top-actions{
  display:flex; gap:8px; justify-content:flex-start;
  padding:10px 12px; background:var(--bg2);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}

.tools-panel{
  display:flex; gap:8px; flex-wrap:wrap;
  padding:10px 12px; background:var(--bg2);
  border-bottom:1px solid var(--line);
}
.tools-panel[hidden]{display:none}
.tool-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:9px;
  background:var(--card); border:1px solid var(--line);
  color:var(--ink); font:inherit; font-size:13px; font-weight:600;
  cursor:pointer;
}
.tool-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.tool-btn.danger{color:var(--red)}
.tool-btn.danger:hover{background:var(--red); color:#fff; border-color:var(--red)}
.tool-btn svg{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.search-row{
  padding:10px 12px; background:var(--bg2);
  border-bottom:1px solid var(--line);
}
.search-row input{
  width:100%; padding:10px 14px;
  font:inherit; font-size:15px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--ink);
  text-align:right; outline:none;
}
.search-row input:focus{border-color:var(--accent)}

.table-wrap{overflow-x:auto; overflow-y:visible; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:separate; border-spacing:0; min-width:900px}
thead th{
  position:sticky;
  top:calc(var(--top-total) + 55px + env(safe-area-inset-top,0px));
  z-index:100;
  background:var(--bg2);
  border-bottom:2px solid var(--line2);
  border-left:1px solid var(--line);
  padding:8px 4px;
  font-size:13px; font-weight:700; color:var(--ink);
  text-align:center; vertical-align:top;
}
thead th:last-child{border-left:none}

thead th .th-inner{display:flex; flex-direction:column; align-items:center; gap:4px}
thead th input{
  width:88%; border:none; background:transparent;
  font:inherit; font-weight:700; font-size:13px;
  color:inherit; text-align:center; padding:2px;
  border-bottom:1px dashed var(--line2); outline:none;
}
thead th .max-mark{font-size:11px; color:var(--red); font-weight:700}
thead th .max-mark input{
  width:38px; display:inline-block; text-align:center;
  border-bottom:1px dashed var(--line2);
  color:var(--red); font-weight:700;
}
:root[data-theme="dark"] thead th .max-mark,
:root[data-theme="dark"] thead th .max-mark input{color:#fff}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) thead th .max-mark,
  :root:not([data-theme="light"]) thead th .max-mark input{color:#fff}
}

th.sec-col{background:linear-gradient(180deg,#e4e4e4,#d8d8d4); min-width:180px; border-left:2px solid var(--line2)}
:root[data-theme="dark"] th.sec-col{background:linear-gradient(180deg,#2d3835,#263130)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) th.sec-col{background:linear-gradient(180deg,#2d3835,#263130)}
}
th.sec-col input{border-bottom:1px dashed var(--line2); font-weight:800; font-size:14px; width:60px}
th.sec-col .sub-line{font-size:12px; color:var(--mut); margin-top:2px; display:flex; gap:4px; justify-content:center; align-items:center; flex-wrap:wrap}
th.sec-col .sub-line input{width:105px; font-size:12px; font-weight:600; color:var(--ink2)}

th.col-act{background:#e9ece4}
th.col-par{background:#e9ece4}
th.col-hw{background:#f4dadd}
th.col-tot{background:#f5dcc8}
th.col-t1{background:#f2eecf}
th.col-t2{background:#cfe2ee}
th.col-att{background:#cfe2ee}
:root[data-theme="dark"] th.col-act,
:root[data-theme="dark"] th.col-par,
:root[data-theme="dark"] th.col-hw,
:root[data-theme="dark"] th.col-tot,
:root[data-theme="dark"] th.col-t1,
:root[data-theme="dark"] th.col-t2,
:root[data-theme="dark"] th.col-att{background:#2d3835; color:var(--ink)}

tbody tr{transition:background-color .15s}
tbody tr:hover{background:rgba(31,92,85,.04)}
tbody td{
  border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);
  padding:6px 4px; text-align:center;
  color:var(--ink); font-size:14px;
}
tbody td:last-child{border-left:none}

td.name-cell{
  padding:0; min-width:180px; text-align:right;
  vertical-align:middle;
}
td.name-cell .name-wrapper{
  display:flex; align-items:center; gap:6px;
  padding:5px 8px;
  min-height:34px;
  box-sizing:border-box;
}
td.name-cell input{
  flex:1; border:none; background:transparent;
  font:inherit; font-size:14px; color:var(--ink);
  text-align:right; padding:4px 6px;
  outline:none; border-radius:6px; min-width:0;
  transition:background-color .15s;
}
td.name-cell input:not([readonly]){
  background:var(--bg2);
  box-shadow:inset 0 0 0 2px var(--accent);
}
td.num-cell{width:48px; background:var(--bg2); font-weight:700; font-size:13px}
td.num-cell input{
  width:100%; border:none; background:transparent;
  text-align:center; font:inherit; font-weight:700;
  font-size:13px; color:var(--ink); outline:none;
}
td.cell input{
  width:100%; border:none; background:transparent;
  text-align:center; font:inherit; font-size:14px;
  color:var(--ink); padding:6px 2px;
  outline:none; border-radius:6px;
  transition:background-color .15s;
}
td.cell input:focus{background:var(--bg2); box-shadow:inset 0 0 0 2px var(--accent)}

td.total-cell{background:#f5dcc8; font-weight:800}
:root[data-theme="dark"] td.total-cell{background:#2d3835}

.confirm-btn{
  width:34px; height:34px; border-radius:50%;
  background:transparent; border:none; cursor:pointer; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--green); transition:.15s;
}
.confirm-btn:hover{background:rgba(34,168,84,.12)}
.confirm-btn:active{transform:scale(.9)}
.confirm-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}

td.total-cell .total-display{
  display:flex; align-items:center; gap:2px; justify-content:center;
}
td.total-cell .total-display input{
  flex:1; min-width:0; font-weight:800; font-size:15px;
  border:none; background:transparent;
  color:var(--ink); text-align:center; outline:none;
}
td.total-cell .edit-btn{
  border:none; background:transparent;
  color:var(--mut); cursor:pointer;
  padding:4px; border-radius:6px;
  display:inline-flex; align-items:center; justify-content:center;
}
td.total-cell .edit-btn:hover{background:var(--bg2); color:var(--ink)}
td.total-cell .edit-btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

td.att-cell{padding:4px 2px}
.att-group{display:flex; gap:4px; justify-content:center; align-items:center}
.att-btn{
  width:30px; height:30px; border-radius:50%;
  border:2px solid transparent;
  background:transparent; color:#fff;
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; opacity:.35; padding:0;
  transition:.15s;
}
.att-btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.att-btn.on{opacity:1; outline:2px solid var(--ink); outline-offset:2px}
.att-btn.present{background:var(--green)}
.att-btn.absent{background:var(--red)}
.att-btn.late{background:var(--orange)}
.att-btn:hover{opacity:.85}

.att-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; color:#fff; flex:none;
}
.att-badge svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.att-badge.present{background:var(--green)}
.att-badge.absent{background:var(--red)}
.att-badge.late{background:var(--orange)}

.modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,.5);
  display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:500;
  animation:fade .2s;
}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0} to{opacity:1}}
.modal-content{
  background:var(--card); color:var(--ink);
  border-radius:18px; padding:20px;
  width:100%; max-width:460px; max-height:88vh; overflow:auto;
  box-shadow:var(--shadow2);
  animation:slideUp .25s;
}
@keyframes slideUp{from{transform:translateY(20px); opacity:0} to{transform:none; opacity:1}}
.modal-content h3{margin:0 0 14px; font-size:18px; font-weight:800; color:var(--accent)}
.form-field{
  width:100%; padding:11px 14px;
  font:inherit; font-size:15px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--bg2); color:var(--ink);
  margin-bottom:10px; outline:none;
}
.form-field:focus{border-color:var(--accent)}
textarea.form-field{min-height:110px; resize:vertical}
.modal-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.modal-actions .btn{flex:1; justify-content:center}

.menu-list{display:flex; flex-direction:column; gap:6px}
.menu-item{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-radius:10px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--ink); font:inherit; font-size:15px; font-weight:600;
  cursor:pointer; text-align:right; width:100%;
  transition:.15s;
}
.menu-item:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.menu-item.danger{color:var(--red)}
.menu-item.danger:hover{background:var(--red); color:#fff; border-color:var(--red)}
.menu-item svg{width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.toast{
  position:fixed;
  top:calc(var(--top-total) + env(safe-area-inset-top,0px) + 16px);
  left:50%; transform:translateX(-50%);
  background:var(--accent); color:#fff;
  padding:12px 22px; border-radius:999px;
  font-weight:700; font-size:14px;
  box-shadow:var(--shadow2); z-index:99999;
  animation:fade .2s; pointer-events:none;
  max-width:90%; text-align:center;
  display:flex; align-items:center; gap:8px;
}
.toast svg{width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}

.stats-list{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto}
.stats-item{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:10px 12px;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:10px;
}
.stats-name{flex:1; font-size:15px; font-weight:600; color:var(--ink); overflow-wrap:anywhere}
.stats-counts{display:flex; gap:6px; flex:none}
.stat-pill{
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:999px;
  color:#fff; font-size:13px; font-weight:700;
}
.stat-pill svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.stat-pill.present{background:var(--green)}
.stat-pill.absent{background:var(--red)}
.stat-pill.late{background:var(--orange)}

.num-keypad{
  position:fixed; bottom:0; left:0; right:0;
  z-index:10000; background:var(--bg2);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; gap:6px; direction:ltr;
}
.num-keypad[hidden]{display:none}
.num-keypad button{
  flex:1; font:inherit; font-size:20px; font-weight:700;
  padding:12px 0; border-radius:9px;
  background:var(--card); color:var(--ink);
  border:1px solid var(--line);
  cursor:pointer; user-select:none; -webkit-user-select:none;
  transition:.1s;
}
.num-keypad button:active{transform:scale(.95); background:var(--accent); color:#fff}
.num-keypad button.kx{background:var(--bg2); font-size:16px; flex:1.2}

.drop-zone{
  border:2px dashed var(--blue); border-radius:12px;
  padding:26px 14px; text-align:center;
  cursor:pointer; background:rgba(31,78,140,.04);
  transition:.15s; margin-bottom:12px;

.drop-zone:hover,.drop-zone.dragover{background:rgba(31,78,140,.12); border-color:var(--accent)}
.drop-zone svg{width:38px; height:38px; color:var(--blue); margin-bottom:8px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.drop-zone p{font-size:14px; color:var(--mut); margin:3px 0}
.drop-zone b{color:var(--blue); font-size:15px}

.zoom-bar{

  padding:14px 16px; margin:14px 0;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:14px;
}
.zoom-slider{flex:1; min-width:0}

  background:var(--line); border-radius:3px; outline:none;
}

  -webkit-appearance:none; width:24px; height:24px;
  background:var(--accent); border-radius:50%; cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.zoom-slider input[type=range]::-moz-range-thumb{
  width:24px; height:24px; background:var(--accent);
  border-radius:50%; cursor:pointer; border:none;
}
.zoom-btn{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--line); background:var(--card);
  color:var(--ink); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  flex:none; transition:.15s;
}
.zoom-btn:active{transform:scale(.92)}
.zoom-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.zoom-preview{

.pull-indicator{

  background:var(--accent); color:#fff;
  padding:10px 22px; border-radius:999px;
  font-weight:700; font-size:13px;
  box-shadow:var(--shadow2);
  z-index:9999; pointer-events:none;
  display:flex; align-items:center; gap:8px;
}
.pull-indicator svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}

.select-mode-bar{
  position:fixed;
  bottom:calc(var(--bot) + env(safe-area-inset-bottom,0px) + 10px);
  left:50%; transform:translateX(-50%);
  background:var(--red); color:#fff;
  padding:10px 18px; border-radius:999px;

  box-shadow:var(--shadow2); z-index:9999;
  font-weight:700; font-size:14px;
  max-width:94%;
}
.select-mode-bar[hidden]{display:none}
.select-mode-bar .count{
  background:rgba(255,255,255,.25);

  font-size:13px;
}
.select-mode-bar button{
  background:transparent; border:1px solid rgba(255,255,255,.5);
  color:#fff; padding:6px 14px; border-radius:999px;
  font:inherit; font-weight:700; font-size:13px; cursor:pointer;
}
.select-mode-bar button:active{transform:scale(.95)}

.select-check{
  width:22px; height:22px; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  border:2px solid var(--line2); border-radius:6px;
  background:var(--card); cursor:pointer;
  transition:.15s;
}
.select-check.checked{
  background:var(--red); border-color:var(--red); color:#fff;
}
.select-check svg{
  width:14px; height:14px;
  fill:none; stroke:currentColor; stroke-width:3;
  stroke-linecap:round; stroke-linejoin:round;
  opacity:0; transition:.15s;

.select-check.checked svg{opacity:1}

tr.select-row td{cursor:pointer}
tr.select-row td.att-cell{cursor:default}

.color-palette{
  display:flex; flex-wrap:wrap; gap:10px;
  margin:14px 0; justify-content:center;
}
.color-palette span{

  cursor:pointer; border:2px solid transparent;
  transition:.15s;
}
.color-palette span:hover{transform:scale(1.08)}
.color-palette span.selected{
  border-color:var(--ink);
  box-shadow:0 0 0 3px var(--accent);
}
